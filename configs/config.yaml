data:
  root: "data"
  subjects: [4]
  conditions_available:
    - "walk_attend"
    - "walk_unattend"
    # - "sit_attend"      # uncomment when preprocessed
    # - "sit_unattend"    # uncomment when preprocessed
  condition_labels:
    walk_attend: "Attend_Walk"
    walk_unattend: "Unattend_Walk"
    sit_attend: "Attend_Sit"
    sit_unattend: "Unattend_Sit"
  et_folder_map:
    walk_attend: "Attend_Walk"
    walk_unattend: "Unattend_Walk"
    sit_attend: "Attend_Sit"
    sit_unattend: "Unattend_Sit"
  epoch_window_ms: [-200, 800]
  pre_stimulus_gaze_window_ms: 2000
  sfreq: 250

eeg:
  reference_channels: ["TP9", "TP10"]
  filter_low: 0.1
  filter_high: 30.0
  sfreq_target: 250
  use_gedai: true
  apply_ica: false
  trigger_latency_offset: 60
  tmin: -0.2
  tmax: 0.8
  baseline: [-0.2, 0]

clip_categories:
  - "sky"
  - "water"
  - "people"
  - "vegetation"
  - "trail_ground"
  - "other"

model:
  eegnet:
    F1: 8
    D: 2
    F2: 16
    dropout: 0.5
    kernel_length: 64
    sep_kernel_length: 16
    use_transformer: false
    transformer_heads: 2
    transformer_dropout: 0.1
  gaze_encoder:
    embedding_dim: 32
    hidden_dim: 64
    encoder_type: "lstm"
  fusion:
    dropout: 0.3

training:
  learning_rate: 0.001
  batch_size: 32
  epochs: 100
  early_stopping_patience: 10
  random_seed: 42

compute:
  # Mixed-precision (autocast + GradScaler) on CUDA. Roughly 1.5-2x faster
  # on a 4090 for ResNet/EEGNet, with fp16 numerics. Set to false if you
  # want bit-identical results to the published CPU/CPU-fp32 metrics.
  use_amp: true
  # DataLoader worker processes for image-loading datasets (ResNet, etc.).
  # 0 = single-process (slow on JPEG-heavy data). 8 is a good default for
  # a 4090-class GPU paired with a modern desktop CPU. Drop to 4 if you see
  # memory pressure; raise to 12+ on a 16-core+ workstation.
  dataloader_workers: 8
  # Number of batches each worker prefetches into a queue. 4 helps smooth
  # over disk-latency spikes (OneDrive, network drives, slow SSDs).
  prefetch_factor: 4
  # Keep worker processes alive between epochs (avoids respawn cost). Only
  # used when dataloader_workers > 0.
  persistent_workers: true
  # cuDNN autotuner: tries multiple kernel implementations on the first
  # batch and picks the fastest. ~5-15% speedup for fixed-shape conv nets
  # (ResNet, EEGNet) at the cost of ~1s extra at the start of training.
  cudnn_benchmark: true
  # channels-last memory format for conv nets. In theory another 10-30%
  # throughput on Ada/Ampere with AMP, but in practice it depends heavily
  # on the (torch + cudnn + GPU + model) combo. On RTX 4090 + torch 2.10 +
  # cu126 we measured a regression for ResNet-50 + fp16, so default is OFF.
  # Benchmark with `python -c "from device_utils import ..."` before flipping.
  channels_last: false

loso:
  enabled: true
  subjects: [3, 4]
  run_dirs:
    3: "2026-05-01_1432_sj03_all_cond_test"
    4: "2026-04-23_1613_sj04_walk_pilot"

flags:
  run_generalization: false
  run_fusion: true
  save_embeddings: true

results:
  output_dir: "results/"

preprocessed:
  use_existing_run: true
  run_name: null  # null = auto-detect latest
